name: E2E Nightly (full suite)

on:
  schedule:
    - cron: '0 2 * * *'  # ogni notte alle 02:00 UTC
  workflow_dispatch:

env:
  E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
  E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run full E2E suite
        # Non blocca: vogliamo il report anche se falliscono spec.
        continue-on-error: true
        run: npx playwright test --reporter=html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json

      - name: Post results to dashboard
        if: always()
        continue-on-error: true
        run: node scripts/post-e2e-results.mjs
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          E2E_WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-html-report
          path: playwright-report/
          retention-days: 30

      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-json
          path: playwright-results.json
          retention-days: 30

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-traces
          path: test-results/
          retention-days: 14