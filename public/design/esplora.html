<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Template maschera Esplora — WCA Partner</title>
<style>
  :root{
    --bg:#0a0a1a; --surface:#141432; --surface-2:#181840; --border:#26265c;
    --fg:#e8e8f5; --muted:#8d8dae; --accent:#4f46e5;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --ai:#a855f7; --brown:#b07c48;
    --r:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  a{color:inherit}
  .wrap{max-width:1400px;margin:0 auto;padding:24px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:20px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:20}
  .tab{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:11px;font-weight:600;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  section[hidden]{display:none}
  .note{border-left:2px solid var(--accent);background:#4f46e51a;padding:10px 12px;border-radius:0 8px 8px 0;font-size:12px;color:#c9c9e6;margin:0 0 14px}
  .note b{color:#fff}

  /* shell */
  .shell{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface);height:640px;display:flex;flex-direction:column}
  .topbar{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);background:#0d0d24}
  .brand{font-weight:700;font-size:12px;letter-spacing:.04em}
  .topbar .spacer{flex:1}
  .pagehead{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border)}
  .crumb{font-size:12px;color:var(--muted)}
  .crumb b{color:var(--fg);font-weight:600}
  .toolbar{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);background:#111129}
  .body{flex:1;display:flex;min-height:0}
  .rail{width:210px;flex:none;border-right:1px solid var(--border);background:#0f0f26;overflow:auto;padding:10px}
  .rail.right{border-right:0;border-left:1px solid var(--border);width:240px}
  .col{flex:1;min-width:0;display:flex;flex-direction:column}
  .list{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
  .detail{flex:1;min-width:0;border-left:1px solid var(--border);overflow:auto;padding:14px;background:#101026}

  /* atoms */
  .btn{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;border-radius:8px;border:1px solid var(--border);background:#1a1a3d;color:var(--fg);font-size:11px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn.icon{width:26px;padding:0;justify-content:center}
  .input{height:26px;flex:1;min-width:0;border-radius:8px;border:1px solid var(--border);background:#0f0f26;color:var(--fg);padding:0 9px;font-size:11px}
  /* BADGE — solo due tinte: blu (sistema/appartenenza) e marrone (attenzione/stato).
     Resa "vetrata": fondo traslucido + blur + filo di luce interno. */
  .badge{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border:1px solid;
    backdrop-filter:blur(6px) saturate(140%);-webkit-backdrop-filter:blur(6px) saturate(140%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 1px 2px rgba(0,0,0,.35)}
  .b-blue{background:linear-gradient(180deg,rgba(79,70,229,.30),rgba(79,70,229,.14));color:#c3c0fb;border-color:rgba(129,120,248,.45)}
  .b-brown{background:linear-gradient(180deg,rgba(176,124,72,.30),rgba(120,80,44,.14));color:#e2b98c;border-color:rgba(196,146,92,.45)}
  /* alias legacy → si collassano sulle due sole tinte ammesse */
  .b-neutral,.b-accent{background:linear-gradient(180deg,rgba(79,70,229,.30),rgba(79,70,229,.14));color:#c3c0fb;border-color:rgba(129,120,248,.45)}
  .b-ok,.b-warn{background:linear-gradient(180deg,rgba(176,124,72,.30),rgba(120,80,44,.14));color:#e2b98c;border-color:rgba(196,146,92,.45)}

  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:12px 0 6px}
  .lab:first-child{margin-top:0}
  .muted{color:var(--muted)}
  .tiny{font-size:11px}

  /* card partner */
  .card{border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .card:hover{border-color:#4f46e580}
  .card.sel{border-color:var(--accent);background:#4f46e514}
  .logo{width:34px;height:34px;flex:none;border-radius:8px;background:#22224f;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#9a9ad2}
  .cmain{flex:1;min-width:0}
  .crow1{display:flex;align-items:center;gap:6px}
  .cname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow2{display:flex;align-items:center;gap:10px;margin-top:3px;color:var(--muted);font-size:11px}
  .crow3{display:flex;align-items:center;gap:8px;margin-top:6px}
  .chip{height:20px;display:inline-flex;align-items:center;gap:4px;padding:0 7px;border-radius:6px;border:1px solid var(--border);background:#ffffff08;font-size:10px;color:var(--muted)}
  .cact{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .score{font-size:11px;font-weight:700;color:#a5a1f5}

  /* filtri */
  .frow{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;border-radius:6px;font-size:12px;cursor:pointer}
  .frow:hover{background:#ffffff0a}
  .frow.on{background:#4f46e526;color:#fff}
  .cnt{font-size:10px;color:var(--muted)}

  /* detail */
  .dhead{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .dlogo{width:48px;height:48px;border-radius:10px;background:#22224f;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;color:#9a9ad2}
  .dtabs{display:flex;gap:4px;margin:12px 0}
  .dtab{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;color:var(--muted);border:1px solid transparent;cursor:pointer}
  .dtab.on{background:#1a1a3d;border-color:var(--border);color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .panel{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:10px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12px}
  .kv span:first-child{color:var(--muted);font-size:11px}

  .bulkbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#4f46e51f;border-bottom:1px solid #4f46e566}
  .kpi{display:flex;gap:8px}
  .kpibox{border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface-2);min-width:78px}
  .kpibox b{display:block;font-size:15px}
  .kpibox span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

  .table{width:100%;border-collapse:collapse;font-size:12px}
  .table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#111129}
  .table td{padding:7px 8px;border-bottom:1px solid #ffffff0d}
  .table tr:hover td{background:#ffffff08}

  .phone{width:360px;height:640px;border:1px solid var(--border);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);margin:0 auto}
  .legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}

  /* raggruppamenti */
  .tabgroup{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 6px;border:1px solid var(--border);border-radius:999px;background:#0f0f26}
  .tabgroup > .gname{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;padding-right:2px}
  .grp{border:1px solid var(--border);border-radius:var(--r);background:#ffffff05;padding:8px;margin-bottom:8px}
  .grp > .lab{margin:0 0 6px}
  .grp:last-child{margin-bottom:0}
  .sep{width:1px;height:16px;background:var(--border);margin:0 2px;flex:none}
  .seg{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg > .btn{border:0;border-radius:0;background:transparent}
  .seg > .btn + .btn{border-left:1px solid var(--border)}
  .seg > .btn.on{background:var(--accent);color:#fff}
  .sect{display:flex;align-items:center;gap:8px;margin:14px 0 8px;grid-column:1/-1}
  .sect .t{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:#a5a1f5}
  .sect .line{flex:1;height:1px;background:var(--border)}
  .sect:first-child{margin-top:0}
  .stack > .btn{width:100%;margin-bottom:6px;justify-content:flex-start}
  .stack > .btn:last-child{margin-bottom:0}

  /* DROPDOWN — usato solo dove le opzioni sono >4 e mutuamente esclusive */
  .dd{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:#12122e;color:var(--fg);font-size:11px;font-weight:600;cursor:pointer}
  .dd .k{color:var(--muted);font-weight:600}
  .dd::after{content:'▾';color:var(--muted);font-size:10px}
  /* BANDIERA — un solo posto per riga; mai bandiera + sigla paese insieme */
  .flag{font-size:12px;line-height:1}
  .inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .inv .panel b{font-size:12px}
  .inv ul{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:11.5px}
  .inv li{margin:2px 0}
  .inv .n{float:right;color:#c3c0fb;font-weight:800;font-size:11px}

</style>

</head>
<body>
<div class="wrap">
  <h1>Maschera «Esplora → WCA Partner» — template unico</h1>
  <div class="sub">Stesso scheletro, 7 stati. Ogni cosa è raggruppata per funzione: filtrare (rail sinistro), leggere (corpo), agire (rail destro).</div>

  <div class="tabs" role="tablist">
    <span class="tabgroup"><span class="gname">Censimento</span>
      <button class="tab" role="tab" aria-selected="true" data-v="v0">0 · Inventario e funzioni</button>
    </span>
    <span class="tabgroup"><span class="gname">Lavoro</span>
      <button class="tab" role="tab" aria-selected="false" data-v="v1">1 · Lista + Dettaglio</button>

      <button class="tab" role="tab" aria-selected="false" data-v="v2">2 · Solo lista</button>
      <button class="tab" role="tab" aria-selected="false" data-v="v3">3 · Selezione multipla</button>
      <button class="tab" role="tab" aria-selected="false" data-v="v4">4 · Dettaglio pieno</button>
    </span>
    <span class="tabgroup"><span class="gname">Rese dati</span>
      <button class="tab" role="tab" aria-selected="false" data-v="v5">5 · Tabella</button>
      <button class="tab" role="tab" aria-selected="false" data-v="v6">6 · Mobile</button>
    </span>
    <span class="tabgroup"><span class="gname">Regole</span>
      <button class="tab" role="tab" aria-selected="false" data-v="v7">7 · Anatomia card</button>
    </span>
  </div>


  <section id="v0"></section>
  <section id="v1" hidden></section>

  <section id="v2" hidden></section>
  <section id="v3" hidden></section>
  <section id="v4" hidden></section>
  <section id="v5" hidden></section>
  <section id="v6" hidden></section>
  <section id="v7" hidden></section>
</div>

<script>
const COMPANIES = [
  {n:'"EUGENE" Logistics Co., Ltd.', c:'Busan', f:'🇰🇷', k:'EU', s:86, badge:'WCA', extra:2, contact:'Jin-Ho Park · Sales Dir.', last:'2 g fa', ch:'✉ 💬 in'},
  {n:'Nordwind Spedition GmbH', c:'Hamburg', f:'🇩🇪', k:'NS', s:74, badge:'WCA', extra:1, contact:'Anke Wolff · KAM', last:'6 g fa', ch:'✉ in'},
  {n:'Trans Adriatic Cargo Srl', c:'Trieste', f:'🇮🇹', k:'TA', s:69, badge:'CRM', extra:0, contact:'Marco Bellini', last:'oggi', ch:'✉ 💬'},
  {n:'Pacific Rim Forwarding', c:'Singapore', f:'🇸🇬', k:'PR', s:91, badge:'WCA', extra:3, contact:'Wei Lim · MD', last:'1 mese', ch:'✉'},
  {n:'Atlas Freight Services', c:'Casablanca', f:'🇲🇦', k:'AF', s:52, badge:'BCA', extra:1, contact:'—', last:'mai', ch:'✉'},
  {n:'Baltic Line Logistics', c:'Gdańsk', f:'🇵🇱', k:'BL', s:63, badge:'WCA', extra:0, contact:'Ewa Nowak', last:'12 g fa', ch:'✉ in'},
];

const topbar = `<div class="topbar">
  <span class="brand">TMWE</span>
  <button class="btn ghost">☰ Maschere</button>
  <input class="input" style="max-width:260px" placeholder="Cerca ovunque   ⌘K" />
  <span class="spacer"></span>
  <span class="tiny muted">Luca Arcanà</span>
</div>`;

// HEADER — 3 gruppi: contesto | assistente | azioni di pagina
function pagehead(actions){return `<div class="pagehead">
  <span class="crumb">Esplora / <b>WCA Partner</b></span>
  <span style="flex:1"></span>
  <span class="seg" title="Assistente"><button class="btn">✦ AI</button><button class="btn icon">🎙</button></span>
  <span class="sep"></span>
  <button class="btn" title="Riepilogo">📊 Riepilogo</button>
  ${actions||''}
  <button class="btn icon" title="Altre azioni">⋯</button>
</div>`;}

// TOOLBAR — 3 gruppi: cercare | vedere | ordinare/contare
function toolbar(extra){return `<div class="toolbar">
  <input class="input" style="max-width:250px" placeholder="Cerca partner, città, referente…" />
  <button class="btn">Filtri <span class="badge b-blue" style="margin-left:4px">3</span></button>
  <span class="sep"></span>
  ${extra||'<span class="seg"><button class="btn on">▦ Card</button><button class="btn">▤ Tabella</button></span>'}
  <span class="sep"></span>
  <span class="dd" title="Ordinamento (7 criteri: dropdown)"><span class="k">Ordina</span> Score ↓</span>
  <span class="dd" title="Vista salvata (elenco lungo: dropdown)"><span class="k">Vista</span> Corea + attivi</span>
  <span style="flex:1"></span>
  <span class="tiny muted">1.248 aziende · 3 filtri attivi</span>
</div>`;}


// RAIL SINISTRO — solo filtri, in 4 gruppi chiusi
function fgroup(title, rows){return `<div class="grp"><div class="lab">${title}</div>${rows}</div>`;}
const frows = (arr)=>arr.map(([a,b,on])=>`<div class="frow ${on?'on':''}">${a} <span class="cnt">${b}</span></div>`).join('');
const railLeft = `<div class="rail">
  ${fgroup('Viste salvate', frows([['Corea + attivi',42,1],['Da ricontattare',18,0]]))}
  ${fgroup('Dove — geografia', frows([['🇰🇷 Corea',42,1],['🇩🇪 Germania',88],['🇮🇹 Italia',131],['🇸🇬 Singapore',27],['🇵🇱 Polonia',35],['🇲🇦 Marocco',9]]))}
  ${fgroup('Chi — relazione', frows([['Attivo',1041],['Holding',64],['Mai contattato',143]]))}
  ${fgroup('Come — qualità dati', frows([['Con email',920],['Con LinkedIn',411],['Senza referente',203]]))}
  <button class="btn" style="width:100%;margin-top:4px;justify-content:center">Filtri avanzati…</button>
</div>`;


function card(c, sel, i){return `<div class="card ${sel?'sel':''}">
  <div class="logo">${c.k}</div>
  <div class="cmain">
    <div class="crow1">
      <span class="cname">${c.n}</span>
      <span class="badge b-blue">${c.badge}</span>
      ${c.alert?`<span class="badge b-brown">${c.alert}</span>`:c.extra?`<span class="badge b-blue">+${c.extra}</span>`:''}
    </div>
    <div class="crow2"><span><span class="flag">${c.f}</span> ${c.c}</span><span>·</span><span>${c.contact}</span></div>

    <div class="crow3">
      <span class="chip">${c.ch}</span>
      <span class="chip">ultimo contatto ${c.last}</span>
    </div>
  </div>
  <div class="cact">
    <span class="score">${c.s}</span>
    <button class="btn icon" title="Azioni">⋯</button>
  </div>
</div>`;}

// DETTAGLIO — panoramica divisa in 3 sezioni funzionali: Chi è / Relazione / Operatività
function sect(t){return `<div class="sect"><span class="t">${t}</span><span class="line"></span></div>`;}
const detail = `<div class="detail">
  <div class="dhead">
    <div class="dlogo">EU</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:15px;font-weight:700">"EUGENE" Logistics Co., Ltd.</div>
      <div class="tiny muted">🇰🇷 Busan, Corea del Sud · Membro WCA dal 2016 · Score 86</div>
    </div>
    <button class="btn primary">Contatta</button>
    <button class="btn icon">⋯</button>
    <button class="btn icon" title="Chiudi">✕</button>
  </div>
  <div class="dtabs">
    <div class="dtab on">Panoramica</div>
    <span class="sep"></span>
    <div class="dtab">Referenti (4)</div><div class="dtab">Comunicazioni</div>
    <span class="sep"></span>
    <div class="dtab">Biglietti (2)</div><div class="dtab">Deep Search</div>
  </div>
  <div class="grid2">
    ${sect('Chi è — anagrafica')}
    <div class="panel">
      <div class="lab">Identità</div>
      <div class="kv"><span>Sede</span><b>Busan, KR</b></div>
      <div class="kv"><span>Tipo ufficio</span><b>HQ</b></div>
      <div class="kv"><span>Sito</span><b>eugenelog.co.kr</b></div>
      <div class="kv"><span>Membership</span><b>scade 04/2027</b></div>
    </div>
    <div class="panel">
      <div class="lab">Servizi e mercati</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${['Air Freight','Sea LCL','Sea FCL','Customs','Project Cargo','KR ↔ EU'].map(s=>`<span class="chip">${s}</span>`).join('')}
      </div>
    </div>

    ${sect('Relazione — come stiamo messi')}
    <div class="panel">
      <div class="lab">Stato</div>
      <div class="kv"><span>Stato</span><b><span class="dot" style="background:var(--ok)"></span> Attivo</b></div>
      <div class="kv"><span>Owner</span><b>Luca Arcanà</b></div>
      <div class="kv"><span>Score</span><b>86</b></div>
    </div>
    <div class="panel">
      <div class="lab">Storico</div>
      <div class="kv"><span>Ultimo contatto</span><b>2 giorni fa</b></div>
      <div class="kv"><span>Interazioni</span><b>37</b></div>
      <div class="kv"><span>Prossima azione</span><b>Follow-up 05/09</b></div>
    </div>

    ${sect('Persone — con chi parliamo')}
    <div class="panel" style="grid-column:1/-1">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="logo">JP</div>
        <div style="flex:1"><b>Jin-Ho Park</b><div class="tiny muted">Sales Director · jinho@eugenelog.co.kr</div></div>
        <span class="seg"><button class="btn">✉ Email</button><button class="btn">💬 WA</button><button class="btn">in</button></span>
      </div>
    </div>
  </div>
</div>`;

// RAIL DESTRO — azioni raggruppate per intenzione + stato
const railRight = `<div class="rail right">
  <div class="grp"><div class="lab">Comunicare</div><div class="stack">
    <button class="btn primary">✉ Contatta referente</button>
    <button class="btn">📣 Crea campagna</button>
  </div></div>
  <div class="grp"><div class="lab">Arricchire</div><div class="stack">
    <button class="btn">✦ Deep Search</button>
    <button class="btn">🔎 Trova referenti</button>
  </div></div>
  <div class="grp"><div class="lab">Organizzare</div><div class="stack">
    <button class="btn">＋ Aggiungi a Cockpit</button>
    <button class="btn">⇩ Esporta</button>
  </div></div>
  <div class="grp"><div class="lab">Stato dati</div>
    <div class="kv"><span>Completezza</span><b>72%</b></div>
    <div class="kv"><span>Ultimo enrich</span><b>14/08</b></div>
    <div class="kv"><span>Duplicati</span><b>0</b></div>
  </div>
  <div class="grp"><div class="lab">Attività recente</div>
    <div class="tiny muted">✉ Risposta ricevuta · 2 g<br/>✦ Deep Search L2 · 14/08<br/>💬 WhatsApp inviato · 03/08</div>
  </div>
</div>`;


function shell(inner){return `<div class="shell">${topbar}${inner}</div>`;}

// V1 lista + dettaglio
document.getElementById('v1').innerHTML = `
